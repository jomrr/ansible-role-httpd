---
# role: httpd
# file: tasks/assert.yml

- name: Assert httpd platform variables
  ansible.builtin.assert:
    that:
      - __httpd_packages is defined
      - __httpd_service_name is defined
      - __httpd_binary is defined
      - __httpd_managed_directories is defined
      - __httpd_main_config_path is defined
      - __httpd_modules_config_path is defined
      - __httpd_listen_config_path is defined
      - __httpd_tls_config_path is defined
      - __httpd_default_vhost_config_path is defined
      - __httpd_vhost_dir is defined
      - __httpd_server_root is defined
      - __httpd_runtime_dir is defined
      - __httpd_pid_file is defined
      - __httpd_user is defined
      - __httpd_group is defined
      - __httpd_module_dir is defined
      - __httpd_mpm_modules is defined
      - __httpd_minimal_modules is defined
      - __httpd_tls_modules is defined
      - __httpd_default_vhost_certificate_packages is defined
      - __httpd_default_vhost_certificate_file is defined
      - __httpd_default_vhost_certificate_key_file is defined
      - __httpd_default_vhost_certificate_csr_file is defined
      - __httpd_validate_main_config_command is defined
      - __httpd_validate_vhost_config_command is defined
    fail_msg: >-
      Incomplete platform variables for role httpd:
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}
      (os_family={{ ansible_facts['os_family'] }}).
  tags:
    - httpd_assert

- name: Assert selected httpd MPM can be rendered or is platform-managed
  ansible.builtin.assert:
    that:
      - __httpd_mpm_modules | length == 0 or httpd_mpm in __httpd_mpm_modules
    fail_msg: "Selected httpd_mpm has no platform MPM module mapping."
  tags:
    - httpd_assert

- name: Assert httpd listener policy
  ansible.builtin.assert:
    that:
      - httpd_listen | length > 0
    fail_msg: "httpd_listen must contain at least one listener."
  tags:
    - httpd_assert

- name: Assert httpd listener definitions
  ansible.builtin.assert:
    that:
      - item.port | int >= 1
      - item.port | int <= 65535
      - item.address is not defined or item.address | trim | length > 0
      - item.address is not defined or item.address | trim != '*'
    fail_msg: >-
      Invalid httpd_listen item. Listener ports must be in range 1..65535.
      Omit address for wildcard listeners; do not use address='*'.
  loop: "{{ httpd_listen }}"
  loop_control:
    label: "{{ item.address | default('*') }}:{{ item.port | default('undefined') }}"
  tags:
    - httpd_assert

- name: Assert httpd listener endpoints are unique
  ansible.builtin.assert:
    that:
      - __httpd_listener_endpoints | length == __httpd_listener_endpoints | unique | list | length
    fail_msg: "httpd_listen must not contain duplicate normalized address/port endpoints."
  vars:
    __httpd_listener_addresses: >-
      {{
        httpd_listen
        | map(attribute='address')
        | map('default', '*', true)
        | map('trim')
        | list
      }}
    __httpd_listener_ports: >-
      {{
        httpd_listen
        | map(attribute='port')
        | map('int')
        | map('string')
        | list
      }}
    __httpd_listener_endpoints: >-
      {{
        __httpd_listener_addresses
        | zip(__httpd_listener_ports)
        | map('join', ':')
        | list
      }}
  tags:
    - httpd_assert

- name: Assert httpd default vhost input
  ansible.builtin.assert:
    that:
      - httpd_default_vhost_server_name | trim | length > 0
    fail_msg: >-
      Default vhost management requires a non-empty server name.
  tags:
    - httpd_assert

- name: Assert httpd required module input
  ansible.builtin.assert:
    that:
      - __httpd_minimal_modules is sequence
      - __httpd_minimal_modules is not string
      - __httpd_minimal_modules | length > 0
      - __httpd_tls_modules is sequence
      - __httpd_tls_modules is not string
      - __httpd_tls_modules | length > 0
    fail_msg: "__httpd_minimal_modules and __httpd_tls_modules must be non-empty platform lists."
  tags:
    - httpd_assert

- name: Assert httpd required module definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name is defined
      - item.name | trim | length > 0
      - item.file is defined or item.path is defined
      - item.file is not defined or item.file | trim | length > 0
      - item.path is not defined or item.path | trim | length > 0
    fail_msg: >-
      Invalid role-required httpd module entry. Every module requires a non-empty name
      and either a non-empty file or path.
  loop: "{{ __httpd_minimal_modules + __httpd_tls_modules }}"
  loop_control:
    label: "{{ item.name | default('unnamed module') }}"
  tags:
    - httpd_assert

- name: Assert httpd extra module definitions
  ansible.builtin.assert:
    that:
      - item.name | trim | length > 0
      - item.file is defined or item.path is defined
      - item.file is not defined or item.file | trim | length > 0
      - item.path is not defined or item.path | trim | length > 0
    fail_msg: >-
      Every httpd_extra_modules entry requires a non-empty name
      and either a non-empty file or path.
  loop: "{{ httpd_extra_modules }}"
  loop_control:
    label: "{{ item.name | default('unnamed module') }}"
  tags:
    - httpd_assert

- name: Assert httpd custom log definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - (item.file is defined) != (item.pipe is defined)
      - item.file is not defined or item.file | trim | length > 0
      - item.pipe is not defined or item.pipe | trim | length > 0
      - (item.format_name is defined) != (item.format_string is defined)
      - item.format_name is not defined or item.format_name | trim | length > 0
      - item.format_name is not defined or not (item.format_name is search('\s'))
      - item.format_string is not defined or item.format_string | trim | length > 0
      - item.condition is not defined or item.condition is mapping
      - item.condition is not defined or (item.condition.env is defined) != (item.condition.expr is defined)
      - item.condition is not defined or item.condition.env is not defined or item.condition.env | trim | length > 0
      - item.condition is not defined or item.condition.env is not defined or not (item.condition.env is search('\s'))
      - item.condition is not defined or item.condition.env is defined or item.condition.negate is not defined
      - item.condition is not defined or item.condition.expr is not defined or item.condition.expr | trim | length > 0
    fail_msg: >-
      Every httpd_custom_logs entry requires exactly one target (file or pipe),
      exactly one format (format_name or format_string), and at most one condition
      (condition.env with optional negate, or condition.expr).
  loop: "{{ httpd_custom_logs }}"
  loop_control:
    label: >-
      {{
        item.file | default(item.pipe | default('undefined custom log'))
      }}
  tags:
    - httpd_assert

- name: Assert httpd TLS random seed definitions
  ansible.builtin.assert:
    that:
      - item.source | trim | length > 0
      - item.bytes is not defined or item.bytes | int > 0
      - item.source != 'builtin' or item.bytes is not defined
    fail_msg: >-
      Every httpd_tls_random_seeds item requires a non-empty source.
      bytes is optional, must be positive when set, and must not be set for source=builtin.
  loop: "{{ httpd_tls_random_seeds }}"
  loop_control:
    label: "{{ item.context | default('undefined') }}:{{ item.source | default('undefined') }}"
  tags:
    - httpd_assert

- name: Assert httpd vhost file definitions
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9][A-Za-z0-9._-]*\\.conf$')
      - item.name != '000-default-deny.conf'
      - item.state | default('present') in ['present', 'absent']
      - item.state | default('present') == 'absent' or item.name > '000-default-deny.conf'
      - item.state | default('present') == 'absent' or item.content is defined
      - item.state | default('present') == 'absent' or item.content | trim | length > 0
    fail_msg: >-
      Every httpd_vhost_files item requires a relative .conf name, must not replace 000-default-deny.conf,
      must sort after 000-default-deny.conf unless state=absent, and requires non-empty content unless state=absent.
  loop: "{{ httpd_vhost_files }}"
  loop_control:
    label: "{{ item.name | default('undefined vhost file') }}"
  tags:
    - httpd_assert

- name: Assert httpd vhost file names are unique
  ansible.builtin.assert:
    that:
      - >-
        httpd_vhost_files | map(attribute='name') | list | length
        == httpd_vhost_files | map(attribute='name') | list | unique | list | length
    fail_msg: "httpd_vhost_files must not contain duplicate file names."
  tags:
    - httpd_assert
