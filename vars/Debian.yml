---
# role: httpd
# file: vars/Debian.yml

__httpd_packages:
  - apache2

__httpd_default_vhost_certificate_packages:
  - python3-cryptography

__httpd_service_name: apache2

__httpd_binary: /usr/sbin/apache2

__httpd_managed_directories:
  - path: /etc/apache2/managed/conf.d
    mode: "0755"
  - path: /etc/apache2/managed/modules.d
    mode: "0755"
  - path: /etc/apache2/managed/vhost.d
    mode: "0755"
  - path: /etc/apache2/managed/tls/certs
    mode: "0755"
  - path: /etc/apache2/managed/tls/csr
    mode: "0755"
  - path: /etc/apache2/managed/tls/private
    mode: "0700"
  - path: /var/cache/apache2
    mode: "0755"
  - path: /var/log/apache2
    mode: "0755"
  - path: /run/apache2
    mode: "0755"

__httpd_main_config_path: /etc/apache2/apache2.conf
__httpd_modules_config_path: /etc/apache2/managed/modules.d/00-modules.conf
__httpd_listen_config_path: /etc/apache2/managed/conf.d/00-listen.conf
__httpd_tls_config_path: /etc/apache2/managed/conf.d/00-tls.conf
__httpd_default_vhost_config_path: /etc/apache2/managed/vhost.d/000-default-deny.conf
__httpd_vhost_dir: /etc/apache2/managed/vhost.d

__httpd_default_vhost_certificate_file: /etc/apache2/managed/tls/certs/httpd-default-deny.crt
__httpd_default_vhost_certificate_key_file: /etc/apache2/managed/tls/private/httpd-default-deny.key
__httpd_default_vhost_certificate_csr_file: /etc/apache2/managed/tls/csr/httpd-default-deny.csr

__httpd_server_root: /etc/apache2
__httpd_runtime_dir: /run/apache2
__httpd_pid_file: /run/apache2/apache2.pid
__httpd_user: www-data
__httpd_group: www-data

__httpd_error_log: /var/log/apache2/error.log
__httpd_access_log: /var/log/apache2/access.log
__httpd_types_config: /etc/mime.types

__httpd_tls_session_cache: shmcb:/var/cache/apache2/sslcache(512000)
__httpd_tls_stapling_cache: shmcb:/var/cache/apache2/ocspcache(128000)

__httpd_modules_include_glob: /etc/apache2/managed/modules.d/*.conf
__httpd_conf_include_glob: /etc/apache2/managed/conf.d/*.conf
__httpd_vhost_include_glob: /etc/apache2/managed/vhost.d/*.conf

__httpd_module_dir: /usr/lib/apache2/modules

__httpd_validate_main_config_command: >-
  {{ __httpd_binary }} -t -f %s

__httpd_mpm_modules:
  event:
    name: mpm_event_module
    file: mod_mpm_event.so
  worker:
    name: mpm_worker_module
    file: mod_mpm_worker.so
  prefork:
    name: mpm_prefork_module
    file: mod_mpm_prefork.so

__httpd_minimal_modules:
  - name: authn_core_module
    file: mod_authn_core.so
  - name: authz_core_module
    file: mod_authz_core.so
  - name: alias_module
    file: mod_alias.so
  - name: dir_module
    file: mod_dir.so
  - name: mime_module
    file: mod_mime.so
  - name: env_module
    file: mod_env.so
  - name: setenvif_module
    file: mod_setenvif.so
  - name: reqtimeout_module
    file: mod_reqtimeout.so

__httpd_tls_modules:
  - name: ssl_module
    file: mod_ssl.so
  - name: socache_shmcb_module
    file: mod_socache_shmcb.so

__httpd_suse_sysconfig_path: ""
