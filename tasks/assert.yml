---
# role: httpd
# file: tasks/assert.yml

- name: "HTTPD | Assert vhost file names"
  ansible.builtin.assert:
    quiet: true
    that:
      - __httpd_vhost_file.name is match('^[A-Za-z0-9][A-Za-z0-9._-]*[.]conf$')
      - __httpd_vhost_file.name != '000-default-deny.conf'
    fail_msg: >-
      Each vhost requires a relative .conf name and must not replace 000-default-deny.conf.
  loop: "{{ httpd_vhost_files }}"
  loop_control:
    loop_var: __httpd_vhost_file
    label: "{{ __httpd_vhost_file.name }}"
  tags:
    - httpd_assert

- name: "HTTPD | Assert present vhost definitions"
  ansible.builtin.assert:
    quiet: true
    that:
      - __httpd_vhost_file.name > '000-default-deny.conf'
      - __httpd_vhost_file.content | trim | length > 0
    fail_msg: "Present vhosts must sort after 000-default-deny.conf and require non-empty content."
  loop: "{{ httpd_vhost_files }}"
  loop_control:
    loop_var: __httpd_vhost_file
    label: "{{ __httpd_vhost_file.name }}"
  when: __httpd_vhost_file.state | default('present') == 'present'
  tags:
    - httpd_assert

- name: "HTTPD | Assert vhost file names are unique"
  ansible.builtin.assert:
    quiet: true
    that:
      - httpd_vhost_files | length == httpd_vhost_files | map(attribute='name') | unique | list | length
    fail_msg: "httpd_vhost_files must not contain duplicate file names."
  tags:
    - httpd_assert
