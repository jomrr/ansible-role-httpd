---
# role: httpd
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
  inventory:
    group_vars:
      all:
        httpd_listen:
          - port: 8080
          - port: 8443
            protocol: "https"
        httpd_vhost_files:
          - name: "100-molecule-redirect.conf"
            content: |-
              <VirtualHost *:8080>
                  ServerName molecule.example
                  Redirect permanent / https://molecule.example/
              </VirtualHost>
verifier:
  name: "ansible"
scenario:
  name: "default"
platforms:
  - name: "httpd"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
