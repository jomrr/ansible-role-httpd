---
# role: httpd
# file: tasks/main.yml

- name: "HTTPD | Load platform variables"
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"
  tags:
    - httpd_vars

- name: "HTTPD | Validate role inputs"
  ansible.builtin.import_tasks: assert.yml
  tags:
    - httpd_assert

- name: "HTTPD | Ensure packages are installed"
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __httpd_packages + httpd_extra_packages }}"
    state: present
  tags:
    - httpd_install

- name: "HTTPD | Ensure default-deny certificate packages are installed"
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __httpd_default_vhost_certificate_packages }}"
    state: present
  when: "'https' in httpd_listen | map(attribute='protocol', default='http')"
  tags:
    - httpd_install
    - httpd_tls

- name: "HTTPD | Ensure SELinux bindings are installed"
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __httpd_selinux_packages }}"
    state: present
  when:
    - ansible_facts.selinux.status == 'enabled'
    - httpd_sebooleans | length > 0
  tags:
    - httpd_install
    - httpd_selinux

- name: "HTTPD | Manage persistent SELinux booleans"
  become: true
  become_user: root
  ansible.posix.seboolean:
    name: "{{ __httpd_seboolean.key }}"
    state: "{{ __httpd_seboolean.value }}"
    persistent: true
  loop: "{{ httpd_sebooleans | dict2items }}"
  loop_control:
    loop_var: __httpd_seboolean
    label: "{{ __httpd_seboolean.key }}"
  when:
    - ansible_facts.selinux.status == 'enabled'
    - not ansible_check_mode
  tags:
    - httpd_selinux

- name: "HTTPD | Configure"
  ansible.builtin.import_tasks: config.yml
  tags:
    - httpd_config

- name: "HTTPD | Ensure service is enabled and started"
  become: true
  become_user: root
  ansible.builtin.service:
    name: "{{ __httpd_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode
  tags:
    - httpd_service
