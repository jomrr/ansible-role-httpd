---
# role: httpd
# file: molecule/resources/playbooks/verify.yml

- name: "HTTPD | Verify"
  hosts: all
  gather_facts: true
  vars:
    __httpd_verify_role_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  tasks:
    - name: "HTTPD | Load role defaults for verification"
      ansible.builtin.include_vars:
        file: "{{ __httpd_verify_role_path }}/defaults/main.yml"
        name: __httpd_verify_role_defaults

    - name: "HTTPD | Assert default-deny HTTP host is forbidden"
      ansible.builtin.uri:
        url: "http://{{ __httpd_verify_listener.address | default('127.0.0.1') }}:{{ __httpd_verify_listener.port }}/"
        headers:
          Host: "{{ httpd_default_vhost_server_name | default(__httpd_verify_role_defaults.httpd_default_vhost_server_name) }}"
        status_code:
          - 403
      loop: "{{ httpd_listen }}"
      loop_control:
        loop_var: __httpd_verify_listener
        label: "{{ __httpd_verify_listener.port }}"
      when:
        - __httpd_verify_listener.protocol is not defined or __httpd_verify_listener.protocol == 'http'

    - name: "HTTPD | Assert managed application vhost redirects"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/"
        headers:
          Host: molecule.example
        follow_redirects: none
        status_code:
          - 301
      register: __httpd_verify_redirect

    - name: "HTTPD | Assert managed application vhost redirect target and module header"
      ansible.builtin.assert:
        quiet: true
        that:
          - __httpd_verify_redirect.location == 'https://molecule.example/'
          - __httpd_verify_redirect.x_molecule_module == 'path-only'

    - name: "HTTPD | Assert unknown HTTP host is rejected or denied"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/"
        headers:
          Host: invalid.example
        status_code:
          - 400
          - 403

    - name: "HTTPD | Assert default-deny HTTPS endpoint completes TLS and denies or rejects the request"
      ansible.builtin.uri:
        url: "https://127.0.0.1:8443/"
        validate_certs: false
        status_code:
          - 400
          - 403
          - 421
      when: "'https' in httpd_listen | map(attribute='protocol', default='http')"
