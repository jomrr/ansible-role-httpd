---
# role: httpd
# file: tasks/main.yml

- name: "HTTPD | Load platform variables"
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags:
    - httpd_vars

- name: "HTTPD | Derive listener facts"
  ansible.builtin.set_fact:
    __httpd_has_https_listener: >-
      {{
        httpd_listen
        | selectattr('protocol', 'defined')
        | selectattr('protocol', 'equalto', 'https')
        | list
        | length > 0
      }}
  changed_when: false
  tags:
    - always

- name: "HTTPD | Validate role inputs"
  ansible.builtin.import_tasks: assert.yml
  tags:
    - httpd_assert

- name: "HTTPD | Ensure packages are installed"
  ansible.builtin.package:
    name: "{{ __httpd_packages + httpd_extra_packages }}"
    state: present
  tags:
    - httpd_install

- name: "HTTPD | Ensure default-deny certificate packages are installed"
  ansible.builtin.package:
    name: "{{ __httpd_default_vhost_certificate_packages }}"
    state: present
  when: __httpd_has_https_listener | bool
  tags:
    - httpd_install
    - httpd_tls

- name: "HTTPD | Configure"
  ansible.builtin.import_tasks: config.yml
  tags:
    - httpd_config

- name: "HTTPD | Ensure service is enabled and started"
  ansible.builtin.service:
    name: "{{ __httpd_service_name }}"
    enabled: true
    state: started
  tags:
    - httpd_service
